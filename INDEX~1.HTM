<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chris Bowne</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="gallery"></main>

<!-- Lightbox: hidden overlay that shows a clicked photo full-size -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="">
  <p id="lightbox-caption"></p>
</div>

<script src="images.js"></script>
<script>
  // Builds the page from the IMAGES list in images.js.
  // To add a photo: put the file in the /images folder and add an
  // entry (filename + caption) to the IMAGES array in images.js.
  const gallery = document.getElementById('gallery');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxCaption = document.getElementById('lightbox-caption');

  function openLightbox(src, caption) {
    lightboxImg.src = src;
    lightboxCaption.textContent = caption || '';
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  }

  IMAGES.forEach(function (item) {
    const figure = document.createElement('figure');

    const img = document.createElement('img');
    img.src = 'images/' + item.file;
    img.alt = item.caption || '';
    img.loading = 'lazy';
    img.addEventListener('click', function () {
      openLightbox(img.src, item.caption);
    });
    figure.appendChild(img);

    if (item.caption) {
      const caption = document.createElement('figcaption');
      caption.textContent = item.caption;
      figure.appendChild(caption);
    }

    gallery.appendChild(figure);
  });

  // Close when clicking the X, clicking the dark background, or pressing Escape
  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox || e.target.classList.contains('lightbox-close')) {
      closeLightbox();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });
</script>

</body>
</html>
